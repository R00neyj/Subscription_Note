<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>페이지를 찾을 수 없습니다 | 구독노트</title>
<!-- 404 는 색인 대상이 아니다 -->
<meta name="robots" content="noindex, follow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F8FAFC; --fg:#0F172A; --muted:#64748B;
    --card:#FFFFFF; --line:#E2E8F0; --primary:#2563EB;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0F172A;--fg:#F1F5F9;--muted:#94A3B8;--card:#1E293B;--line:#334155;--primary:#60A5FA}
  }
  body{
    font-family:"Pretendard","Malgun Gothic",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--fg);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  main{max-width:520px; width:100%; text-align:center}
  .code{
    font-size:14px; font-weight:800; letter-spacing:.14em;
    color:var(--primary); margin-bottom:14px;
  }
  h1{font-size:clamp(26px,6vw,34px); font-weight:900; letter-spacing:-.03em; margin-bottom:14px}
  p{color:var(--muted); font-size:16px; font-weight:500; margin-bottom:32px}
  .actions{display:flex; flex-wrap:wrap; gap:10px; justify-content:center}
  a{
    display:inline-flex; align-items:center; justify-content:center;
    height:50px; padding:0 24px; border-radius:14px;
    font-size:16px; font-weight:800; text-decoration:none;
    transition:opacity .15s ease;
  }
  a:hover{opacity:.85}
  .primary{background:var(--primary); color:#fff}
  .ghost{background:var(--card); border:1px solid var(--line); color:var(--fg)}
  .brand{margin-top:40px; font-size:14px; font-weight:800; color:var(--muted)}
</style>
</head>
<body>
  <main>
    <div class="code">404 NOT FOUND</div>
    <h1>이 주소에는 페이지가 없습니다</h1>
    <p>주소가 바뀌었거나 잘못 입력됐을 수 있습니다.<br />아래에서 원하는 곳으로 이동해 주세요.</p>
    <div class="actions">
      <a class="primary" href="/landing">구독노트 홈</a>
      <a class="ghost" href="/guide/">구독 해지 방법 모아보기</a>
    </div>
    <div class="brand">구독노트</div>
  </main>
</body>
</html>
